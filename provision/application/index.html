<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentinelOps</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #120018, #1d0f2f, #0f2b16);
            color: #f4f4f4;
        }

        .card {
            background: rgba(20, 20, 20, 0.82);
            border: 2px solid #7cff6b;
            border-radius: 20px;
            padding: 48px 36px;
            max-width: 700px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 25px rgba(124, 255, 107, 0.25),
                        0 0 40px rgba(159, 92, 255, 0.25);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 18px;
            color: #9f5cff;
            text-shadow: 0 0 10px rgba(159, 92, 255, 0.6);
        }

        p {
            font-size: 1.15rem;
            line-height: 1.7;
            color: #d8ffd2;
            margin-bottom: 16px;
        }

        .badge {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 18px;
            border-radius: 999px;
            background: linear-gradient(90deg, #7cff6b, #9f5cff);
            color: #111;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>SentinelOps</h1>
        <p>Private Docker Compose application behind host Nginx.</p>
        <p>This page validates the SentinelOps reverse-proxy architecture and secure backend isolation.</p>
        <div class="badge">Phase 1 · Compose Deployment</div>
    </div>
</body>
</html>
